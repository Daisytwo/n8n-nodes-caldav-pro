name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what vitest supports (^18 || ^20 || >=22); 20 and 22 are
        # the versions n8n itself runs on.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run build

      # Runs before lint: a misconfigured flat config makes `lint` pass while
      # enforcing nothing, which is worse than a failure.
      - name: Verify the lint presets actually enforce
        run: npm run lint:selftest

      - run: npm run lint

      - run: npm test

      # Exercises the same script the live smoke test runs, against an
      # in-memory CalDAV server — no credentials, no network.
      - name: Smoke test (offline)
        run: npm run smoke:dryrun

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check tarball contents
        run: npm run check:package

  # Guards the one thing tests cannot: that the version being tagged is the
  # version in package.json.
  version-matches-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag with package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
